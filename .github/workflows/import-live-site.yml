name: Import live Netlify site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Mirror the existing public website
        run: |
          mkdir -p /tmp/site-mirror
          wget \
            --recursive \
            --level=2 \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --no-host-directories \
            --directory-prefix=/tmp/site-mirror \
            --domains=kastineaugak.netlify.app \
            https://kastineaugak.netlify.app/ \
            https://kastineaugak.netlify.app/about \
            https://kastineaugak.netlify.app/projects \
            https://kastineaugak.netlify.app/somagpt \
            https://kastineaugak.netlify.app/technology \
            https://kastineaugak.netlify.app/music \
            https://kastineaugak.netlify.app/media \
            https://kastineaugak.netlify.app/contact \
            https://kastineaugak.netlify.app/robots.txt \
            https://kastineaugak.netlify.app/sitemap.xml

      - name: Copy mirrored site files into the repository
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            /tmp/site-mirror/ ./
          touch .nojekyll

      - name: Commit imported website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes were found."
            exit 0
          fi
          git commit -m "Import existing live Kastine Augak website"
          git push
